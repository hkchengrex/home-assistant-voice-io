site_name: HA Voice IO
site_description: Home Assistant Voice IO documentation for recognition, training, response generation, and deployment.
site_url: https://hkchengrex.com/home-assistant-voice-io/
repo_url: https://github.com/hkchengrex/home-assistant-voice-io
repo_name: hkchengrex/home-assistant-voice-io
edit_uri: edit/main/documentation/
docs_dir: documentation
site_dir: docs
hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  custom_dir: overrides
  font: false
  icon:
    logo: material/waveform
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Get started:
      - First command: getting-started.md
      - Training Studio: training-studio.md
      - Run continuously: running.md
  - Use it:
      - Connect an automation: integrations.md
      - Generate response audio: response-generation.md
      - Configuration: configuration.md
      - Deploy on your platform: deployment.md
  - Reference:
      - Command line: reference/cli.md
      - Python API: reference/python-api.md
      - Benchmark: benchmark.md
      - Troubleshooting: troubleshooting.md
      - Privacy: privacy.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: MIT License

name: Documentation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ".[docs]"
      - run: mkdocs build --strict
      - name: Verify the published site is current
        run: git diff --exit-code -- docs
